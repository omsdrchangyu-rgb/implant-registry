<style>
/* Layout: navy header band with tabs; one 720px column; case = facts → tooth chart → dated timeline with photo blocks; edits in a bottom sheet */
:root {
  --navy: #3A4B54; --ink: #1E272E; --muted: #56626B; --line: #CBD2D8; --hair: #DDE3E3;
  --bg: #F5F6F8; --card: #FFFFFF; --panel: #EEF1F4;
  --orange: #DD6B20; --orange-deep: #B9531F; --orange-tint: #F6D2BC; --wash: #F8EBE3; --signal: #B04E1E;
  --ok: #3D7A63; --ok-tint: #E2EFE9; --plan: #3F7F86; --plan-tint: #E3F0F1;
  --head-bg: #3A4B54; --head-ink: #FFFFFF; --head-muted: #B9C6CD;
  --crown: #FFFFFF; --enamel: #3F4B4B; --groove: #8A9696; --root: #EAD9C2; --root-p: #D9C3A3; --root-line: #A68F70;
  --ti: #A7B3BA; --ti-dark: #56656D; --ti-light: #D3DBDF; --bridge: #F8EBE3;
  --scrim: rgba(20, 28, 34, .5);
  --sans: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #A9C2CF; --ink: #ECE8E0; --muted: #A6B1B9; --line: #36434D; --hair: #2B3640;
    --bg: #141A20; --card: #1C242C; --panel: #232D36;
    --orange: #EC8140; --orange-deep: #F2965C; --orange-tint: #4B2F1E; --wash: #2C231C; --signal: #F08A5D;
    --ok: #74B79B; --ok-tint: #1E3029; --plan: #7FC2C8; --plan-tint: #1D3133;
    --head-bg: #1C262E; --head-ink: #ECE8E0; --head-muted: #8FA0AA;
    --crown: #E9E5DC; --enamel: #C7CFCF; --groove: #7E8B8B; --root: #6F604C; --root-p: #5E513F; --root-line: #A08A6C;
    --ti: #7F8C93; --ti-dark: #C9D3D8; --ti-light: #4C585F; --bridge: #3A2E24; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #A9C2CF; --ink: #ECE8E0; --muted: #A6B1B9; --line: #36434D; --hair: #2B3640;
  --bg: #141A20; --card: #1C242C; --panel: #232D36;
  --orange: #EC8140; --orange-deep: #F2965C; --orange-tint: #4B2F1E; --wash: #2C231C; --signal: #F08A5D;
  --ok: #74B79B; --ok-tint: #1E3029; --plan: #7FC2C8; --plan-tint: #1D3133;
  --head-bg: #1C262E; --head-ink: #ECE8E0; --head-muted: #8FA0AA;
  --crown: #E9E5DC; --enamel: #C7CFCF; --groove: #7E8B8B; --root: #6F604C; --root-p: #5E513F; --root-line: #A08A6C;
  --ti: #7F8C93; --ti-dark: #C9D3D8; --ti-light: #4C585F; --bridge: #3A2E24; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head-bg); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, .fr:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head-bg); color: var(--head-ink); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 4px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--serif); font-size: 20px; letter-spacing: .04em; }
.brand small { color: var(--head-muted); font-size: 11.5px; letter-spacing: .08em; }
.top-tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.who { font-size: 13px; color: var(--head-muted); }
.who b { color: var(--head-ink); font-weight: 500; }
.modes { display: inline-flex; background: rgba(255,255,255,.1); border-radius: 9px; padding: 2px; gap: 2px; }
.modes button { border: 0; background: none; color: var(--head-muted); font-size: 12.5px; padding: 4px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.modes button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 500; }
body.consult .review, body.consult .why, body.consult .rvx, body.consult .tgl { display: none !important; }
.blurbox { position: absolute; border-radius: 10px; backdrop-filter: blur(18px) saturate(.6); -webkit-backdrop-filter: blur(18px) saturate(.6); background: rgba(120,120,120,.18); z-index: 2; pointer-events: none; }
.ba-stage > .blurbox { z-index: 3; }
.editing .blurbox { z-index: 6; pointer-events: auto; cursor: move; outline: 2px dashed var(--orange); touch-action: none; }
.blurbox .rz { position: absolute; right: -7px; bottom: -7px; width: 18px; height: 18px; border-radius: 50%; background: var(--orange); border: 2px solid #fff; cursor: nwse-resize; }
.blurbox .bx { position: absolute; right: -9px; top: -9px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 22px; padding: 0; cursor: pointer; }
.pblock { position: relative; }
.pb-deid { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 3; }
.peer { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--head-muted); cursor: pointer; user-select: none; white-space: nowrap; }
.switch { width: 38px; height: 22px; border-radius: 11px; background: rgba(255,255,255,.22); position: relative; border: 0; padding: 0; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--orange); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.tabs { display: flex; gap: 20px; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 6px 0 9px; font-weight: 500; color: var(--head-muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--head-ink); border-bottom-color: var(--orange); }

main { padding-block: 18px 72px; display: flex; flex-direction: column; gap: 16px; }
.proto { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--orange); padding: 2px 0 2px 10px; display: flex; flex-direction: column; gap: 6px; }
.proto label { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.proto select { border: 1px solid var(--line); border-radius: 6px; background: var(--card); padding: 2px 6px; font-size: 13px; }
.search { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--card); }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 14px; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: var(--card); }
.btn.warn { border-color: var(--signal); color: var(--signal); }
.btn.sm { padding: 2px 10px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--navy); padding-inline: 6px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.list.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card.pc { display: flex; flex-direction: column; padding: 0; overflow: hidden; gap: 0; }
.card.pc .cthumb { aspect-ratio: 16 / 10; background: var(--panel) center / cover no-repeat; display: grid; place-items: center; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--hair); }
.card.pc .cthumb svg { opacity: .5; }
.ph-fail { position: relative; }
.ph-fail::after { content: "照片讀取失敗"; position: absolute; left: 6px; bottom: 6px; font-size: 11px; background: var(--signal); color: #fff; border-radius: 5px; padding: 0 6px; }
.card.pc .cbody { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card.pc .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.card.pc .name { font-size: 19px; }
.card.pc .sub { font-size: 13px; }
.card.pc .dots { margin: 2px 0; max-width: 100%; }
.tag { display: inline-flex; align-items: center; font-size: 13.5px; font-weight: 700; padding: 2px 10px; border-radius: 7px; border: 1.5px solid var(--tg); background: var(--tgb); color: var(--tgi); white-space: nowrap; line-height: 1.4; }
.tag.sm { font-size: 12px; padding: 0 7px; border-width: 1px; }
.tg-single { --tg: var(--navy); --tgb: var(--panel); --tgi: var(--navy); }
.tg-partial { --tg: var(--plan); --tgb: var(--plan-tint); --tgi: var(--plan); }
.tg-allx { --tg: var(--orange); --tgb: var(--wash); --tgi: var(--orange-deep); }
.tg-re { --tg: var(--signal); --tgb: var(--wash); --tgi: var(--signal); }
.tg-other { --tg: var(--ok); --tgb: var(--ok-tint); --tgi: var(--ok); }
@media (max-width: 640px) {
  .list.cards { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .card.pc { flex-direction: row; }
  .card.pc .cthumb { width: 112px; flex: none; aspect-ratio: auto; border-bottom: 0; border-right: 1px solid var(--hair); }
  .card.pc .cbody { padding: 10px 12px; }
}
#modal:empty { display: none; }
.mscrim { position: fixed; inset: 0; z-index: 15; background: var(--scrim); display: flex; align-items: flex-start; justify-content: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px 24px; }
.modal { background: var(--bg); width: 100%; max-width: 860px; max-height: 100%; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 18px 60px rgba(0,0,0,.35); }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--hair); background: var(--card); }
.mhead b { font-family: var(--serif); font-size: 16px; }
.mbody { overflow-y: auto; padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
@media (max-width: 640px) {
  .mscrim { padding: 0; }
  .modal { border-radius: 0; height: 100%; }
  .mhead { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
  .mbody { padding: 14px max(14px, env(safe-area-inset-left, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)); }
}
.lib { display: flex; flex-direction: column; gap: 10px; }
.md { font-size: 15.5px; line-height: 1.85; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.md h4, .md h5 { margin: 8px 0 0; font-size: 19px; color: var(--navy); }
.md h5 { font-size: 16.5px; }
.md p, .md ul, .md ol { margin: 0; }
.md blockquote { margin: 0; padding: 6px 14px; border-left: 3px solid var(--orange); background: var(--wash); border-radius: 0 8px 8px 0; }
.md mark { background: #FBE3A1; color: inherit; padding: 0 2px; border-radius: 3px; }
.md hr { border: 0; border-top: 1px solid var(--hair); width: 100%; }
.md a { color: var(--plan); }
.sfig { margin: 4px 0; display: flex; flex-direction: column; gap: 4px; }
.sfig .fr { aspect-ratio: auto; }
.sfig .simg { position: static; width: 100%; height: auto; display: block; }
.sfig figcaption { font-size: 13px; color: var(--muted); text-align: center; }
.mdbar { display: flex; flex-wrap: wrap; gap: 6px; }
.mdta { min-height: 280px; font-family: var(--mono); font-size: 14px; line-height: 1.6; }
.story h3 { margin: 0; }
.lib summary { cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; list-style: none; }
.lib summary::-webkit-details-marker { display: none; }
.lib summary h3 { margin: 0; }
.libbar { position: sticky; top: -16px; z-index: 2; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.libbar select { max-width: 100%; min-width: 0; flex: 1 1 200px; }
.thumb .use { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: 10.5px; border-radius: 5px; padding: 0 5px; }
.thumb .star { position: absolute; right: 4px; top: 4px; background: var(--orange); color: #fff; font-size: 10.5px; border-radius: 5px; padding: 0 5px; }
.prog { height: 8px; border-radius: 5px; background: var(--panel); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--orange); transition: width .2s; }
.uprow { display: grid; grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; }
.uprow .im { width: 56px; height: 56px; border-radius: 8px; background: var(--panel) center / cover no-repeat; }
.uprow input, .uprow select { min-width: 0; width: 100%; }
.uprow.done .im { outline: 2px solid var(--ok); }
.uprow.err .im { outline: 2px solid var(--signal); }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchips .chip[disabled] { opacity: .55; cursor: default; }
.chart-m { overflow-x: auto; }
.chart-m svg text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.chart-m .bar { cursor: pointer; }
.mleg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.mleg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.mlist { display: flex; flex-direction: column; border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; }
.mlist button { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; text-align: left; border: 0; border-top: 1px solid var(--hair); background: var(--card); padding: 8px 12px; cursor: pointer; font-size: 13.5px; align-items: center; }
.mlist button:first-child { border-top: 0; }
.rv { display: flex; flex-direction: column; gap: 10px; }
.rvi { background: var(--card); border: 1px solid var(--hair); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.rvi .h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 13px; color: var(--muted); }
.rvi .h b { color: var(--ink); font-family: var(--serif); font-size: 15px; cursor: pointer; }
.rvi .h b:hover { text-decoration: underline; }
.rvi p { margin: 0; white-space: pre-wrap; }
.rvf { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rvf select, .rvf input { min-width: 0; }
.rvf select { font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
.card { background: var(--card); border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; cursor: pointer; text-align: left; width: 100%; }
.card:hover { border-color: var(--navy); }
.card .name { font-family: var(--serif); font-size: 17px; font-weight: 700; min-width: 0; }
.adds [data-act="edu-toggle"][aria-pressed="true"] { background: var(--wash); color: var(--orange-deep); border-color: var(--orange); }
.card .when { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.card .sub { grid-column: 1 / -1; color: var(--muted); font-size: 13.5px; }
.card .dots { grid-column: 1 / -1; margin-block: 6px 2px; }
.card .pills { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 12px; border-radius: 6px; padding: 1px 8px; background: var(--panel); color: var(--muted); white-space: nowrap; }
.pill.warn { background: var(--wash); color: var(--orange-deep); }
.pill.bad { background: var(--signal); color: var(--card); }
.st { font-family: var(--mono); font-size: 11.5px; border-radius: 5px; padding: 1px 7px; white-space: nowrap; }
.st.Success { background: var(--ok-tint); color: var(--ok); }
.st.Survival { background: var(--wash); color: var(--orange-deep); }
.st.Failed { background: var(--signal); color: var(--card); }
.st.Replaced { background: var(--panel); color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }

.back { background: none; border: 0; color: var(--navy); font-weight: 500; padding: 0; cursor: pointer; align-self: flex-start; }
.case-head { display: flex; flex-direction: column; gap: 10px; }
.case-head h2 { margin: 0; font-family: var(--serif); font-size: 26px; text-wrap: balance; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 18px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 11.5px; letter-spacing: .08em; color: var(--muted); }
.facts dd { margin: 0; font-size: 14px; }
.facts dd.flag { color: var(--orange-deep); font-weight: 500; }
.adds { display: flex; flex-wrap: wrap; gap: 8px; }
section.block { background: var(--card); border: 1px solid var(--hair); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
section.block > h3, .h3 { margin: 0; font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 500; }

/* tooth chart */
.chart-scroll { overflow-x: auto; padding: 12px 8px 6px; }
.chart { display: flex; flex-direction: column; gap: 4px; align-items: center; width: max-content; margin: 0 auto; }
.crow { display: flex; gap: 6px; }
.quad { display: flex; }
.quad.up { align-items: flex-end; } .quad.dn { align-items: flex-start; }
.tb { all: unset; display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 4px; }
.tb.has, .tb.pick { cursor: pointer; }
.tb:focus-visible { outline: 2px solid var(--orange); }
.tb .no { font-family: var(--mono); font-size: 10.5px; line-height: 16px; min-width: 18px; text-align: center; color: var(--muted); border-radius: 6px; padding: 0 2px; position: relative; }
.tb.has .no { background: var(--navy); color: var(--card); }
.tb.lost .no { background: var(--orange-deep); color: var(--card); }
.tb.on .no { outline: 2px solid var(--orange); outline-offset: 1px; }
.tb .no i { position: absolute; top: -4px; right: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); border: 1.5px solid var(--card); }
.tb .no small { font-size: 8px; font-weight: 700; margin-left: 1px; position: relative; top: -3px; }
.tb svg { overflow: visible; }
path { stroke-linejoin: round; stroke-linecap: round; }
.c { fill: var(--crown); stroke: var(--enamel); stroke-width: .4; }
.r { fill: var(--root); stroke: var(--root-line); stroke-width: .35; }
.p { fill: var(--root-p); stroke: var(--root-line); stroke-width: .35; }
.g { fill: none; stroke: var(--groove); stroke-width: .35; }
.nat { opacity: .28; }
.picked .c { fill: var(--orange); stroke: var(--orange-deep); }
.picked .r, .picked .p { fill: var(--orange-tint); stroke: var(--orange-deep); }
.picked .g { stroke: #fff; }
.tb.pick .no { color: var(--muted); }
.tb.pick[aria-pressed="true"] .no { color: var(--orange-deep); font-weight: 700; }
.brg .c { fill: var(--bridge); stroke: var(--orange-deep); stroke-width: .35; }
.brg .g { stroke: var(--orange-tint); }
.fx { fill: var(--ti); stroke: var(--ti-dark); stroke-width: .3; }
.th { stroke: var(--ti-dark); stroke-width: .28; fill: none; }
.mua { fill: var(--ti-light); stroke: var(--ti-dark); stroke-width: .25; }
.fail .fx, .fail .mua { fill: none; stroke: var(--signal); stroke-dasharray: .9 .7; stroke-width: .35; }

      const e = new Error(out.error || "未知錯誤"); e.data = out; throw e;
    }
    return out;
  }

  /* ---------- login ---------- */
  function shell(on) {
    document.querySelector(".top-tools").style.visibility = on ? "" : "hidden";
    document.getElementById("tabs").style.visibility = on ? "" : "hidden";
  }
  function showLogin(msg) {
    shell(false);
    document.getElementById("layer").innerHTML = "";
    document.getElementById("app").innerHTML = `<div class="login">
      <h2>植牙病例登記</h2>
      <p>請用診所登記過的 Google 帳號登入。</p>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ""}
      <div id="gbtn"></div>
      <p class="hint">登入一次可以使用 30 天；換手機或清除瀏覽紀錄後要再登入。</p></div>`;
    const draw = () => {
      if (!(window.google && google.accounts && google.accounts.id)) return setTimeout(draw, 200);
      google.accounts.id.initialize({ client_id: CFG.CLIENT_ID, callback: onCredential, ux_mode: "popup", auto_select: false });
      google.accounts.id.renderButton(document.getElementById("gbtn"), { theme: "outline", size: "large", text: "signin_with", shape: "pill", width: 260 });
    };
    if (!document.getElementById("gsi")) {
      const s = document.createElement("script"); s.id = "gsi"; s.src = "https://accounts.google.com/gsi/client"; s.async = true; document.head.appendChild(s);
    }
    draw();
  }
  async function onCredential(resp) {
    const box = document.querySelector(".login");
    if (box) box.insertAdjacentHTML("beforeend", `<p class="hint" id="lgw">登入中…</p>`);
    try {
      const out = await call("login", { credential: resp.credential });
      session = out.session; ls.set(SKEY, session);
      await load();
    } catch (err) {
      const d = err.data || {};
      showLogin(d.error === "NOT_REGISTERED" ? `${d.email} 還沒有登記。請院長在試算表「醫師」頁填上這個 Google 帳號。` : "登入失敗：" + err.message);
    }
  }

  /* ---------- data ---------- */
  function setLoading(text) {
    document.getElementById("app").innerHTML = `<p class="empty">${esc(text)}</p>`;
  }
  /* 上次的資料先存在這支手機，打開時立刻顯示，背景再向伺服器要最新的 */
  const DKEY = "reg_data";
  let lastJSON = "";
  function apply(out) {
    Object.keys(out.data).forEach(k => { DATA[k] = out.data[k]; });
    LAYOUTS.length = 0; out.layouts.forEach(l => LAYOUTS.push(l));
    TOUCHED.clear();
    USER = out.me.name;
    shell(true);
    derive();
    if (!document.querySelector(".sheet")) render();
  }
  async function load(keepView) {
    const cached = ls.get(DKEY);
    if (cached && !lastJSON) { try { apply(JSON.parse(cached)); lastJSON = cached; keepView = true; } catch (e) {} }
    if (!keepView) setLoading("讀取資料中…");
    const out = await call("load");
    const s = JSON.stringify({ me: out.me, data: out.data, layouts: out.layouts });
    if (s !== lastJSON) { lastJSON = s; ls.set(DKEY, s); apply(out); }
    if (view.patient) ensurePhotos(view.patient, "i", true);
    if (view.tab === "other" && view.other) ensurePhotos(view.other, "o", true);
  }

  let chain = Promise.resolve();
  function persist(ops, msg) {
    const busy = document.createElement("div"); busy.className = "toast"; busy.textContent = "儲存中…"; document.body.appendChild(busy);
    chain = chain.then(() => call("persist", { ops })).then(() => { busy.remove(); toast(msg); })
      .catch(err => { busy.remove(); toast("儲存失敗：" + err.message + "（已重新讀取資料）"); return load(true).catch(() => {}); });
    return chain;
  }

  /* ---------- photos ---------- */
  const loaded = {};
  function setPhotos(name, scope, list) {
    for (let i = PHOTOS.length - 1; i >= 0; i--) if (PHOTOS[i].姓名 === name && (PHOTOS[i].範圍 || "i") === scope) PHOTOS.splice(i, 1);
    list.forEach(p => PHOTOS.push(p));
  }
  async function ensurePhotos(name, scope, force) {
    const k = scope + "|" + name;
    if (!name || (loaded[k] === true && !force)) return;
    loaded[k] = true;
    const ck = "reg_ph_" + k, prev = ls.get(ck);
    if (prev && !force) { try { setPhotos(name, scope, JSON.parse(prev)); if (!document.querySelector(".sheet")) render(); } catch (e) {} }
    try {
      const out = await call("photos", { name, scope });
      const s = JSON.stringify(out.photos);
      if (s === prev && !force) return;
      ls.set(ck, s);
      setPhotos(name, scope, out.photos);
      if (!document.querySelector(".sheet")) render();
    } catch (err) { loaded[k] = false; if (err.message !== "AUTH") toast("照片清單讀取失敗：" + err.message); }
  }

  const URLS = {}, PENDING = {}, QUEUE = [], FAILED_AT = {};
  let active = 0;
  const cacheKey = id => "https://photo-cache.local/" + id;
  async function fromCache(id) {
    try { const c = await caches.open("reg-photos-v2"); const r = await c.match(cacheKey(id)); return r ? await r.blob() : null; } catch (e) { return null; }
  }
  async function toCache(id, blob) {
    try { const c = await caches.open("reg-photos-v2"); await c.put(cacheKey(id), new Response(blob)); } catch (e) {}
  }
  function b64Blob(b64, mime) {
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  function paint(id) {
    document.querySelectorAll(`[data-src-ph="${CSS.escape(id)}"]`).forEach(el => {
      if (el.tagName === "IMG") el.src = URLS[id]; else el.style.backgroundImage = `url(${URLS[id]})`;
    });
  }
  async function decodable(blob) {
    try { const b = await createImageBitmap(blob); b.close && b.close(); return true; }
    catch (e) { return new Promise(ok => { const im = new Image(), u = URL.createObjectURL(blob); im.onload = () => { URL.revokeObjectURL(u); ok(true); }; im.onerror = () => { URL.revokeObjectURL(u); ok(false); }; im.src = u; }); }
  }
  function fail(id, msg) {
    PENDING[id] = "failed";
    document.querySelectorAll(`[data-src-ph="${CSS.escape(id)}"]`).forEach(el => { el.classList.add("ph-fail"); el.title = msg; });
    try { console.warn("photo", id, msg); } catch (e) {}
  }
  function show(id, blob) { URLS[id] = URL.createObjectURL(blob); paint(id); }
  /* 先看手機裡有沒有存過；沒有的話，一次向伺服器要最多 6 張 */
  async function fetchBatch(ids) {
    const need = [];
    for (const id of ids) { const b = await fromCache(id); if (b) show(id, b); else need.push(id); }
    if (!need.length) return;
    const out = await call("photoBatch", { ids: need });
    for (const id of need) {
      const r = out.photos[id];
      if (!r || r.error || !r.data) { fail(id, r && r.error || "伺服器沒有回傳照片"); continue; }
      const blob = b64Blob(r.data, String(r.mime || "").indexOf("image/") === 0 ? r.mime : "image/jpeg");
      if (!(await decodable(blob))) { fail(id, "照片格式無法顯示（" + (r.mime || "?") + "）"); continue; }   // 壞掉的資料不存進手機
      toCache(id, blob); show(id, blob);
    }
  }
  function pump() {
    while (active < 3 && QUEUE.length) {
      const ids = QUEUE.splice(0, 6); active++;
      fetchBatch(ids).catch(err => { ids.forEach(id => { if (!URLS[id]) fail(id, err.message || String(err)); }); }).finally(() => { active--; pump(); });
    }
  }
  function photoSrc(id) {
    if (URLS[id]) return URLS[id];
    if (!PENDING[id] || (PENDING[id] === "failed" && Date.now() - (FAILED_AT[id] || 0) > 20000)) { PENDING[id] = true; FAILED_AT[id] = Date.now(); QUEUE.push(id); setTimeout(pump, 0); }
    return PLACEHOLDER;
  }

  async function resize(file, max) {
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch (e) { bmp = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = URL.createObjectURL(file); }); }
    const w = bmp.width, h = bmp.height, k = Math.min(1, max / Math.max(w, h));
    const cv = document.createElement("canvas"); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(ok => cv.toBlob(ok, "image/jpeg", 0.88));
  }
  const blobB64 = blob => new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = bad; r.readAsDataURL(blob); });
  /* Apps Script 不接受帶進度監聽的跨網域上傳（會先送 OPTIONS 被拒絕），所以用一般 fetch，進度依檔案大小估算 */
  async function postWithProgress(body, onProg) {
    const est = 1500 + body.length / 220;            // 約 220 KB/s 加 1.5 秒啟動
    const t0 = Date.now(), timer = setInterval(() => onProg(Math.min(0.95, (Date.now() - t0) / est)), 200);
    try {
      let res;
      try { res = await fetch(CFG.API_URL, { method: "POST", body }); }
      catch (e) { throw new Error("網路中斷或伺服器沒有回應"); }
      const out = await res.json().catch(() => { throw new Error("伺服器回應錯誤（" + res.status + "）"); });
      if (!out.ok) { if (out.error === "AUTH") { session = null; ls.del(SKEY); showLogin("登入已過期，請重新登入。"); } throw new Error(out.error || "上傳失敗"); }
      onProg(1);
      return out;
    } finally { clearInterval(timer); }
  }
  async function upload(name, scope, items, progress, onItem) {
    const n = items.length, frac = new Array(n).fill(0), res = new Array(n).fill(null), seen = {};
    let done = 0, next = 0;
    const tick = () => progress && progress(frac.reduce((a, b) => a + b, 0) / n, done, n);
    const nameFor = base => { seen[base] = (seen[base] || 0) + 1; return base + (seen[base] > 1 ? "_" + seen[base] : "") + ".jpg"; };
    const names = items.map(it => nameFor(it.base));
    async function one(i) {
      try {
        const blob = await resize(items[i].file, 2400);
        frac[i] = 0.1; tick();
        const body = JSON.stringify({ action: "upload", session, name, scope, filename: names[i], mime: "image/jpeg", data: await blobB64(blob) });
        const out = await postWithProgress(body, f => { frac[i] = 0.1 + f * 0.8; tick(); });
        URLS[out.photo.id] = URL.createObjectURL(blob); toCache(out.photo.id, blob);
        res[i] = out.photo; onItem && onItem(i, true);
      } catch (e) { onItem && onItem(i, false, e.message || String(e)); }
      frac[i] = 1; done++; tick();
    }
    async function worker() { while (next < n) { const i = next++; await one(i); } }
    tick();
    await Promise.all([worker(), worker()]);
    return res;
  }

  /* 沒有縮圖的小卡：先用手機裡存過的照片清單，沒有的話背景去讀（一次最多 4 位） */
  let thumbBusy = 0;
  function afterRender(missing) {
    if (!missing || !missing.length) return;
    let changed = false;
    missing.forEach(([scope, name]) => {
      const k = scope + "|" + name;
      if (loaded[k]) return;
      const prev = ls.get("reg_ph_" + k);
      if (prev) { try { setPhotos(name, scope, JSON.parse(prev)); loaded[k] = "cache"; changed = true; } catch (e) {} }
    });
    if (changed) { setTimeout(() => { if (!document.querySelector(".sheet")) render(); }, 0); return; }
    missing.filter(([s, n]) => !loaded[s + "|" + n]).slice(0, Math.max(0, 4 - thumbBusy)).forEach(([scope, name]) => {
      thumbBusy++;
      ensurePhotos(name, scope).finally(() => { thumbBusy--; });
    });
  }

  async function logout() {
    try { await call("logout"); } catch (e) {}
    session = null; ls.del(SKEY); ls.del(DKEY); lastJSON = "";
    try { Object.keys(localStorage).filter(k => k.indexOf("reg_ph_") === 0).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    try { google.accounts.id.disableAutoSelect(); } catch (e) {}
    showLogin("已登出。");
  }

  function boot() {
    if (!CFG.API_URL || !CFG.CLIENT_ID || /PASTE|__/.test(CFG.API_URL + CFG.CLIENT_ID)) {
      shell(false);
      document.getElementById("app").innerHTML = `<div class="login"><h2>還沒設定完成</h2><p>請在 index.html 最上面填入 API_URL（Apps Script 網址）和 CLIENT_ID。</p></div>`;
      return;
    }
    if (session) load().catch(err => { if (err.message === "AUTH") return; if (lastJSON) toast("目前顯示的是上次的資料（" + err.message + "）"); else setLoading("讀取失敗：" + err.message); });
    else showLogin();
  }

  window.API = { boot, persist, photoSrc, fullSrc: photoSrc, afterRender, ensurePhotos, upload, logout, reload: () => load(true) };
})();
</script>

const $ = (s, el = document) => el.querySelector(s);

const dd = s => new Date(s + "T00:00:00");
const mdiff = (a, b) => { const x = dd(a), y = dd(b); let m = (y.getFullYear() - x.getFullYear()) * 12 + y.getMonth() - x.getMonth(); if (y.getDate() < x.getDate()) m--; return Math.max(0, m); };
const today = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`; };
const store = { get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let seq = 100; const uid = p => p + Date.now().toString(36).slice(-5) + (++seq % 1000).toString(36) + Math.random().toString(36).slice(2, 4);

function involved(name, who) {
  return DATA.patients.some(p => p.姓名 === name && (p.建立者 === who || listOf(p.經手醫師).includes(who))) ||

    DATA.temps.concat(DATA.finals).some(t => t.姓名 === name && t.假牙醫師 === who) ||
    DATA.events.some(e => e.姓名 === name && e.記錄醫師 === who) ||
    DATA.plans.some(e => e.姓名 === name && e.規劃醫師 === who);
}

let PROS = [];
const lastContact = {};
function derive() {
  const et = ET();

  PINFO = Object.fromEntries(DATA.photoinfo.map(i => [i.ID, i]));
  Object.keys(lastContact).forEach(k => delete lastContact[k]);
  const bump = (n, d) => { if (d && (!lastContact[n] || d > lastContact[n])) lastContact[n] = d; };
  DATA.events.forEach(e => bump(e.姓名, e.日期));
  DATA.temps.forEach(t => bump(t.姓名, t.交付日期));
  DATA.finals.forEach(f => bump(f.姓名, f.交付日期));
  DATA.implants.forEach(im => {

    im._failDate = evs.filter(e => et[e.類型].程度 === "Survival").map(e => e.日期).sort()[0] || null;
    im._failed = !!im._failDate;
    im._comps = evs.filter(e => et[e.類型].程度 === "Success");

async function exifDate(file) {
  try {
    const buf = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (buf.getUint16(0) !== 0xFFD8) return null;
    let off = 2;
    while (off < buf.byteLength - 4) {

        const str = (o, n) => { let s = ""; for (let i = 0; i < n; i++) s += String.fromCharCode(buf.getUint8(t0 + o + i)); return s; };
        const scan = (ifd, want) => { const n = u16(ifd); for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; if (want.includes(u16(e))) return { tag: u16(e), val: u32(e + 8) }; } return null; };
        const ifd0 = u32(4), sub = scan(ifd0, [0x8769]);
        let hit = sub ? scan(sub.val, [0x9003, 0x9004]) : null;
        if (!hit) hit = scan(ifd0, [0x0132]);
        if (hit) { const s = str(hit.val, 19), m = s.match(/^(\d{4}):(\d{2}):(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`; }
        return null;

}

async function doUpload() {
  if (!UP.rows.length) { $("#ferr").textContent = "請先選擇照片"; return; }
  if (UP.busy) return;
  UP.busy = true;
  const btn = $("[data-act=up-go]"); btn.disabled = true; btn.textContent = "上傳中…";
  $("#upp").hidden = false;
  const items = UP.rows.map(r => ({ file: r.file, base: `${r.date.replace(/-/g, "")}_${r.cat}` }));
  const prog = (frac, done, n) => { const b = $("#upbar"); if (b) b.style.width = Math.round(frac * 100) + "%"; const tx = $("#uptxt"); if (tx) tx.textContent = `已完成 ${done} / ${n} 張（${Math.round(frac * 100)}%）`; };

    const errs = [];

    const added = res.filter(Boolean);

      const isO = UP.scope === "o";

      if (!rec && isO) { rec = { ID: uid("Q"), 姓名: UP.name, 建立者: USER }; DATA.opatients.push(rec); }
      if (rec && !rec.縮圖) { rec.縮圖 = added[0].id; persist([{ op: "put", type: isO ? "opatients" : "patients", rec }], "已設定小卡縮圖"); }
    }
    const failed = res.length - added.length;
    toast(`已上傳 ${added.length} 張${failed ? `，${failed} 張失敗（標紅框），可以再試一次` : ""}`);
    if (failed) $("#ferr").textContent = "失敗原因：" + (errs[0] || "不明");
    if (failed) { UP.rows = UP.rows.filter((r, i) => !res[i]); UP.busy = false; btn.disabled = false; btn.textContent = "重試失敗的"; $("#upv").innerHTML = ""; return; }
    if (UP.fromEditor && ED) { const bk = ED.blocks[ED.active]; added.forEach(ph => bk.檔案.push(ph.id)); ED.sel = added[0]?.id || ED.sel; UP = null; reopenEditor(); }

    else { UP = null; view.libOpen = true; closeSheet(); render(); }
  } catch (err) { UP.busy = false; btn.disabled = false; btn.textContent = "上傳"; $("#ferr").textContent = "上傳失敗：" + (err.message || err); }
}

  rows.forEach(r => r._p = P[r.姓名] || {});

  const filtered = rows.filter(r => dims.every(([k, get]) => { const f = SS.filters[k]; return !f || !f.length || f.includes(get(r)); }));

const summarize = rs => { const n = rs.length, fail = rs.filter(r => r._failed).length, succ = rs.filter(r => r._status === "Success").length;
  return { n, fail, succ, surv: n ? 1 - fail / n : null, succR: n ? succ / n : null, mo: n ? rs.reduce((a, r) => a + r._months, 0) / n : null }; };

}

window.addEventListener("popstate", () => { if (view.patient || view.other || view.article) { closeSheet(); closeCase(true); } });
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, sheet = $(".sheet"), a2 = a;
  if (act === "scrim") { if (e.target === a) { closeSheet(); ED = null; } return; }
  switch (act) {
    case "close": closeSheet(); ED = null; UP = null; return;
    case "tab": view.tab = a.dataset.t; view.patient = null; view.other = null; view.article = null; render(); window.scrollTo(0, 0); return;
    case "cat": { const k = a.dataset.c; view.cats = view.cats.includes(k) ? view.cats.filter(x => x !== k) : view.cats.concat(k); render(); return; }
    case "cat-clear": view.cats = []; render(); return;
    case "ocat": { const k = a.dataset.c; view.ocats = view.ocats.includes(k) ? view.ocats.filter(x => x !== k) : view.ocats.concat(k); render(); return; }
    case "ocat-clear": view.ocats = []; render(); return;
    case "add-oplan": openRecordForm("oplans"); return;
    case "add-osurg": openRecordForm("others"); return;
    case "add-oevent": openRecordForm("oevents"); return;
    case "upload": openUpload(a.dataset.scope); return;
    case "up-cancel": if (UP && UP.fromEditor && ED) { UP = null; reopenEditor(); } else if (UP && UP.fromStory) { const fs = UP.fromStory; UP = null; openStory(fs.name, fs.scope, fs.rec, fs.draft); } else { UP = null; closeSheet(); } return;
    case "story-upload": { const d = storyDraft(), st = STY; openUpload(st.scope, st.name, { name: st.name, scope: st.scope, rec: st.rec, draft: d }); return; }
    case "tag-add": { const el = $("#stg"), cur = listOf(el.value); if (!cur.includes(a.dataset.v)) el.value = cur.concat(a.dataset.v).join("、"); return; }
    case "edu-new": openStory(EDU_NAME, "e", null); return;
    case "art-open": view.article = a.dataset.id; try { history.pushState({ m: 1 }, ""); } catch (e) {} render(); if (window.API) window.API.ensurePhotos(EDU_NAME, "e"); return;
    case "art-edit": openStory(EDU_NAME, "e", DATA.stories.find(s => s.ID === a.dataset.id)); return;
    case "edu-tag": view.eduTag = view.eduTag === a.dataset.t ? "" : a.dataset.t; render(); return;
    case "up-go": doUpload(); return;
    case "logout": window.API.logout(); return;
    case "plan-cmp": { e.preventDefault(); const id = a.dataset.id; view.planCmp = view.planCmp.includes(id) ? view.planCmp.filter(x => x !== id) : view.planCmp.concat(id); render(); return; }
    case "add-plan": openPlanForm(null); return;
    case "edit-plan": openPlanForm(DATA.plans.find(p => p.ID === a.dataset.id)); return;
    case "ofilter": view.oFilter = a.dataset.f; render(); return;
    case "open-other": openCase("o", a.dataset.p); return;
    case "back-other": closeCase(); return;
    case "mclose": closeCase(); return;
    case "mclose-bg": if (e.target === a) closeCase(); return;
    case "add-opat": openRecordForm("opatients"); return;
    case "mchip": if (!a.disabled) a.setAttribute("aria-pressed", a.getAttribute("aria-pressed") !== "true"); return;
    case "lib-pick": { const id = a.dataset.ph, s = view.libSel; view.libSel = s.includes(id) ? s.filter(x => x !== id) : s.concat(id); view.libOpen = true; render(); return; }
    case "lib-clear": view.libSel = []; render(); return;
    case "story-edit": openStory(a.dataset.name, a.dataset.scope); return;
    case "edu-toggle": toggleEdu(a.dataset.name, a.dataset.scope); return;
    case "edu-f": view.eduF = a.dataset.f; render(); return;
    case "story-save": saveStory(); return;
    case "story-del": { const r = STY.rec; DATA.stories = DATA.stories.filter(x => x !== r); STY = null; if (view.article === r.ID) view.article = null; closeSheet(); render(); persist([{ op: "del", type: "stories", id: r.ID }], "已刪除病例故事"); return; }
    case "md": mdWrap(a.dataset.md); return;
    case "md-photo": mdPhotoPicker(); return;
    case "md-ins": mdInsert(a.dataset.ref || "photo:" + a.dataset.ph); return;
    case "md-tab": { const v = a.dataset.t === "view"; $$(".sheet [data-act=md-tab]").forEach(x => x.setAttribute("aria-pressed", x === a)); $("#stx").hidden = v; const pv = $("#stv"); pv.hidden = !v; if (v) { pv.innerHTML = mdRender($("#stx").value, STY.name, STY.scope); if (window.API) window.API.afterRender([]); } return; }
    case "lib-add": libAdd(); return;
    case "lib-thumb": libThumb(); return;
    case "lib-edit": libEdit(); return;
    case "lib-edit-save": libEditSave(); return;
    case "month": view.month = a.dataset.m || null; render(); return;
    case "rv-kind": { const k = a.dataset.k; view.rv.kinds = view.rv.kinds.includes(k) ? view.rv.kinds.filter(x => x !== k) : view.rv.kinds.concat(k); render(); return; }
    case "add-other": view.other = null; openRecordForm("opatients"); return;
    case "filter": view.filter = a.dataset.f; render(); return;
    case "open": if (view.tab === "other" && !a.dataset.keep) view.tab = "cases"; openCase("i", a.dataset.p); return;
    case "back": closeCase(); return;
    case "site": { const n = +a.dataset.site; view.site = view.site === n ? null : n; const c = caseOf(view.patient); $("#chart").innerHTML = chartHTML(c); $("#site").innerHTML = sitePanel(c, view.site); return; }
    case "add-patient": view.patient = null; openRecordForm("patients"); return;
    case "add-surgery": openSurgeryForm(); return;
    case "add-temp": openRecordForm("temps"); return;
    case "add-final": openRecordForm("finals"); return;
    case "add-event": openRecordForm("events"); return;
    case "edit": openRecordForm(a.dataset.type, recById(a.dataset.type, a.dataset.id)); return;
    case "save": SURG && sheet && $(".sitecard, .tb.pick", sheet) ? saveSurgery(sheet) : saveRecordForm(sheet); return;
    case "del": a.hidden = true; $("#delc").hidden = false; return;
    case "del-no": $("#delc").hidden = true; $("[data-act=del]").hidden = false; return;
    case "del-yes": deleteRecord(); return;
    case "pick": togglePick(+a.dataset.site); return;
    case "unpick": togglePick(+a.dataset.site); return;
    case "photos": openPhotoEditor(a.dataset.key, a.dataset.name); return;
    case "zoom": if (ED) return; openLightbox(a.dataset.ph); return;
    case "ed-toggle": { const b = ED.blocks[ED.active], id = a.dataset.ph, k = b.檔案.indexOf(id); if (k >= 0) { b.檔案.splice(k, 1); if (ED.sel === id) ED.sel = b.檔案[0] || null; } else { b.檔案.push(id); ED.sel = id; } edRender(); return; }
    case "ed-type": ED.blocks[ED.active].排版 = a.dataset.t; edRender(); return;
    case "ed-ratio": ED.blocks[ED.active].調整._ratio = a.dataset.r; edRender(); return;
    case "ed-act": ED.active = +a.dataset.i; ED.sel = ED.blocks[ED.active].檔案[0] || null; edRender(); return;
    case "ed-rm": ED.blocks.splice(+a.dataset.i, 1); ED.active = 0; ED.sel = ED.blocks[0].檔案[0] || null; edRender(); return;
    case "ed-add": ED.blocks.push(mkBlock(ED.name, ED.key, "並排", [])); ED.active = ED.blocks.length - 1; ED.sel = null; edRender(); return;
    case "ed-sel": ED.sel = a.dataset.ph; edRender(); return;
    case "ed-reset": delete ED.blocks[ED.active].調整[ED.sel]; edRender(); return;
    case "blur-add": { const bk = ED.blocks[ED.active], key = bk.排版 === "比對" && bk.檔案.length >= 2 ? "_b" : ED.sel, a = adjOf(bk, key); a.blur = (a.blur || []).concat([{ x: 32, y: 24, w: 34, h: 30 }]); bk.調整[key] = a; edRender(); return; }
    case "blur-del": { const bk = ED.blocks[ED.active], a = adjOf(bk, a2.dataset.ph); a.blur.splice(+a2.dataset.i, 1); bk.調整[a2.dataset.ph] = a; edRender(); return; }
    case "mode": MODE = a.dataset.m; peer = MODE !== "full"; consult = MODE === "consult"; store.set("mode", MODE); if (peer && (view.tab === "stats" || view.tab === "review" || view.tab === "other")) view.tab = "cases"; render(); return;
    case "ed-out": { const b = ED.blocks[ED.active]; b.檔案 = b.檔案.filter(x => x !== ED.sel); ED.sel = b.檔案[0] || null; edRender(); return; }
    case "ed-save": saveEditor(); return;
    case "ss-kind": SS.kind = a.dataset.k; SS.filters = {}; SS.g1 = SS.kind === "implant" ? "角度" : "階段"; SS.g2 = ""; store.set("ss", SS); render(); return;
    case "ss-f": { e.preventDefault(); const d = a.dataset.d, v = a.dataset.v, cur = SS.filters[d] || []; SS.filters[d] = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat(v); store.set("ss", SS); render(); $("details.filters").open = true; return; }
    case "ss-clear": e.preventDefault(); SS.filters = {}; store.set("ss", SS); render(); return;
  }
});

document.addEventListener("click", e => { const fr = e.target.closest(".fr"); if (fr && !consult && !fr.closest(".editing") && !fr.closest(".sheet")) openLightbox(fr.dataset.ph); });
function openLightbox(id) {
  const d = document.createElement("div"); d.className = "lb"; d.innerHTML = `<img src="${window.API ? window.API.fullSrc(id) : photoSrc(id)}" alt="" data-src-ph="${id}"><button type="button">關閉</button>`;
  d.addEventListener("click", () => d.remove()); document.body.appendChild(d);
}

/* drag: compare divider (view) and pan (editor) */
let drag = null;
document.addEventListener("dragstart", e => { if (e.target.closest(".ba-stage, .pgrid, .fr")) e.preventDefault(); });
document.addEventListener("pointerdown", e => {
  const stage = e.target.closest(".ba-stage"), fr = e.target.closest(".fr");
  const inEd = !!e.target.closest(".editing");
  const bb = e.target.closest(".blurbox");
  if (bb && inEd && ED && !e.target.closest(".bx")) {
    const bk = ED.blocks[ED.active], id = bb.dataset.ph, i = +bb.dataset.bl, frame = bb.closest(".fr, .ba-stage");
    if (id !== ED.sel && id !== "_b") { ED.sel = id; }
    const r = adjOf(bk, id).blur[i];
    drag = { mode: e.target.closest(".rz") ? "bsize" : "bmove", id, i, sx: e.clientX, sy: e.clientY, o: Object.assign({}, r), box: frame.getBoundingClientRect() };
    e.preventDefault(); return;
  }
  if (inEd && ED) {
    const bk = ED.blocks[ED.active];
    let id = fr ? fr.dataset.ph : null;
    if (stage) id = ED.sel && bk.檔案.slice(0, 2).includes(ED.sel) ? ED.sel : bk.檔案[1];
    if (!id) return;
    if (id !== ED.sel) { ED.sel = id; edRender(); return; }
    const box = (stage || fr).getBoundingClientRect(), a = adjOf(bk, id);
    drag = { mode: "pan", sx: e.clientX, sy: e.clientY, ox: a.x, oy: a.y, box, id };
    e.preventDefault(); return;
  }
  if (stage && !inEd) {
    const b = RENDERED[stage.dataset.bi]; if (!b) return;
    drag = { mode: "div", stage, box: stage.getBoundingClientRect(), b };
    e.preventDefault(); try { window.getSelection().removeAllRanges(); } catch (er) {}
    moveDiv(e.clientX); stage.setPointerCapture(e.pointerId);
  }
});
function moveDiv(x) {
  const pos = Math.max(0, Math.min(100, (x - drag.box.left) / drag.box.width * 100));
  drag.b.調整._pos = pos;
  $(".clip", drag.stage).style.clipPath = `inset(0 ${100 - pos}% 0 0)`; $(".ba-div", drag.stage).style.left = pos + "%";
}
document.addEventListener("pointermove", e => {
  if (!drag) return;
  if (drag.mode === "div") moveDiv(e.clientX);
  else if (drag.mode === "bmove" || drag.mode === "bsize") {
    const bk = ED.blocks[ED.active], a = adjOf(bk, drag.id), r = a.blur[drag.i];
    const dx = (e.clientX - drag.sx) / drag.box.width * 100, dy = (e.clientY - drag.sy) / drag.box.height * 100, cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    if (drag.mode === "bmove") { r.x = +cl(drag.o.x + dx, -10, 100 - drag.o.w + 10).toFixed(1); r.y = +cl(drag.o.y + dy, -10, 100 - drag.o.h + 10).toFixed(1); }
    else { r.w = +cl(drag.o.w + dx, 6, 120).toFixed(1); r.h = +cl(drag.o.h + dy, 6, 120).toFixed(1); }
    bk.調整[drag.id] = a; refreshEdPreview();
  } else {
    const bk = ED.blocks[ED.active], a = adjOf(bk, drag.id);
    a.x = +(drag.ox + (e.clientX - drag.sx) / drag.box.width * 100).toFixed(2); a.y = +(drag.oy + (e.clientY - drag.sy) / drag.box.height * 100).toFixed(2);
    bk.調整[drag.id] = a; refreshEdPreview();
  }
});
document.addEventListener("pointerup", () => { drag = null; });
document.addEventListener("pointercancel", () => { drag = null; });
let rw; window.addEventListener("resize", () => { clearTimeout(rw); rw = setTimeout(() => { if (view.patient && $("#chart")) $("#chart").innerHTML = chartHTML(caseOf(view.patient)); }, 150); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { const lb = $(".lb"); if (lb) lb.remove(); else if ($(".sheet")) { closeSheet(); ED = null; UP = null; } else if (view.patient || view.other || view.article) closeCase(); } });
document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details[data-lib]")) view.libOpen = e.target.open; }, true);

if (window.API) window.API.boot(); else { derive(); render(); }
</script>
